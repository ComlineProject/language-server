[package]
name = "comline-language-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "comline_language_server"
path = "src/lib.rs"

[[bin]]
name = "comline-lsp"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# The `tower-lsp` stdio server (the `comline-lsp` binary). With it off, only the
# analysis library builds — `parser` + `analysis` + `handlers`, over `lsp-types`
# and `comline-core` — and that compiles for `wasm32-unknown-unknown`. The
# Comline playground links the crate that way.
server = ["dep:tower-lsp", "dep:tokio", "dep:tracing-subscriber", "dep:dashmap"]

[dependencies]
# The analysis layer: pure `lsp-types` (serde only, wasm-safe), the parser, and
# `comline-core`. By git rev, like the rest of the tree — the LSP links
# `comline-core` and is part of the GPL toolchain. Local iteration: uncomment
# the `[patch]` below onto a sibling `core` checkout.
lsp-types = "0.94"
rust-sitter = "0.4.5"
tracing = "0.1"
anyhow = "1.0"
# `Command::arguments` is `Vec<serde_json::Value>` — the interactive-rename
# quick fix below hands the client a URI and a position through it.
serde_json = "1.0"
comline-core = { git = "https://github.com/ComlineProject/core", rev = "bd9d9f4557e56db1dbcece1b6fae54c1fc5394fd" }
# What each generator supports, feature by feature (`comline_codegen::features`)
# - for warning at a use a declared language can't generate. Only the
# generators' `SUPPORT` tables are read; nothing is generated. Pinned to the
# same commits as the CLI, so a build has one `comline-codegen`.
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "46ff2b0f98af9c3b6cf92a15f4cf311ef4c19d64" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "7a2c04c871be6ee13ed7e9a64f45b72babda7790" }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "0309d82a8871fc459143ddde653fc8f395571588" }

# `server`-only.
tower-lsp = { version = "0.20.0", optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
dashmap = { version = "5.5", optional = true }

# Local iteration against a sibling `core` checkout — uncomment to build
# `comline-core` from the working tree instead of the pinned git rev.
# Re-comment before pushing; CI has no sibling checkout.
# [patch."https://github.com/ComlineProject/core"]
# comline-core = { path = "../core/core" }

[profile.release]
strip = true
lto = true
